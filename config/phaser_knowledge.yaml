# =============================================================================
# GCAgents Phaser 4 + TypeScript Knowledge Base
# =============================================================================
# Loaded by Designer and Programmer agents during GDD generation and code gen.
# Ensures genre-appropriate architecture, correct Phaser 4 API usage, and
# commercial-quality patterns.
#
# Last updated: 2025-06
# Phaser version: 4.0.x (ESM, TypeScript-native)
# =============================================================================

# -----------------------------------------------------------------------------
# PHASER 4 KEY API NOTES (for code generation)
# -----------------------------------------------------------------------------
# - Import: `import * as Phaser from 'phaser';` (NO default export in ESM build)
# - Scene lifecycle: init() → preload() → create() → update(time, delta)
# - Physics config in GameConfig: physics: { default: 'arcade' } or 'matter'
# - Arcade: this.physics.add.sprite(), this.physics.add.collider(), .overlap()
# - Matter: this.matter.add.sprite(), this.matter.add.rectangle(), .circle()
# - Tweens: this.tweens.add({ targets, props, duration, ease, onComplete })
# - Particles: this.add.particleEmitter() (no .manager needed in v4)
# - Scale: this.scale.width, this.scale.height, Phaser.Scale.FIT / CENTER_BOTH
# - Scene transition: this.scene.start('SceneKey', data)
# - Registry (cross-scene data): this.registry.set(key, val), this.registry.get(key)
# - v4 removed: Pipeline → RenderNode, FX/BitmapMask → Filters, Point → Vector2
# - v4 new: Filters, RenderNodes, SpriteGPULayer, TilemapGPULayer, Lighting component
# - v4 lighting: gameObject.setLighting(true) replaces v3 setPipeline('Light2D')
# - v4 removed Mesh and Plane GameObjects; 3D support planned separately
# -----------------------------------------------------------------------------


# =============================================================================
# A) GENRE ARCHITECTURE MAP
# =============================================================================
# For each genre, specifies recommended physics, pattern, core systems,
# data-driven files, scenes beyond Boot/Menu/Game/GameOver, minimum
# mechanics, and code organization.
# =============================================================================

