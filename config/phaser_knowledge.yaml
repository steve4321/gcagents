              } else {
                  navigator.clipboard.writeText(text);
                  // Show 'Copied!' feedback
              }
          });

      near_miss_feedback:
        description: "Reward players for close calls with visual celebration"
        implementation: |
          // In collision check:
          const dist = Phaser.Math.Distance.Between(player.x, player.y, obstacle.x, obstacle.y);
          if (dist < nearMissThreshold && dist > collisionThreshold) {
              score += nearMissBonus;
              this.cameras.main.shake(50, 0.005);
              this.tweens.add({ targets: nearMissText, alpha: 1, y: '-=20', duration: 300, yoyo: true });
          }
