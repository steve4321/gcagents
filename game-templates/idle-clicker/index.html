<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idle Clicker</title>
  <style>
    body { margin: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #game-container { display: flex; justify-content: center; align-items: center; }
    canvas { display: block; }
  </style>
  <!-- Platform SDK scripts (injected by code generator based on target_platforms) -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v1.js"></script>
  <script src="https://game-cdn.poki.com/sdk/v4/poki-sdk.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <script>
  window.__AD_CONFIG__ = ["crazygames", "poki"];
  </script>
  <script>
  (window as any).__triggerAdBreak = () => {
      try {
          if (window.CrazyGames?.CrazySDK) {
              const sdk = window.CrazyGames.CrazySDK.getInstance();
              sdk.requestAd('midgame', () => {}, () => {});
          }
          if (window.PokiSDK) {
              window.PokiSDK.commercialBreak().then(() => {});
          }
      } catch (e) { /* ad not available */ }
  };
  (window as any).__triggerHappyTime = () => {
      try {
          if (window.CrazyGames?.CrazySDK) {
              window.CrazyGames.CrazySDK.getInstance().happytime();
          }
      } catch (e) {}
  };
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
