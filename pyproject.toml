[project]
name = "gcagents"
version = "0.1.0"
description = "Autonomous AI game company - research, develop, and operate web mini-games"
requires-python = ">=3.11"
dependencies = [
    # ── Orchestration ──
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    # ── AI Models ──
    "langchain-deepseek>=0.1",
    "openai>=1.30",
    "zhipuai>=2.0",
    # ── Data & Storage ──
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "chromadb>=0.5",
    # ── Market Data ──
    "httpx>=0.27",
    "feedparser>=6.0",
    "google-play-scraper>=1.2",
    # ── Game Dev ──
    "jinja2>=3.1",
    # ── Testing ──
    "playwright>=1.45",
    # ── Utils ──
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "croniter>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
gcagents = "orchestrator.main:cli"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
