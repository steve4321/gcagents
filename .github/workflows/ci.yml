# GCAgents CI Workflow
# Runs linting, type checking, and tests on Python 3.11/3.12 for master/main pushes and PRs.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Type check with mypy
        # TODO: Switch to strict=False and remove continue-on-error once pre-existing type issues are resolved
        continue-on-error: true
        run: mypy orchestrator shared agents dashboard

      - name: Run tests
        run: pytest tests/ -v